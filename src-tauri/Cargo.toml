[package]
name = "multi-angle-edit"
version = "26.6.29"
description = "Local Qwen-Image-Edit multi-angle camera tool"
authors = ["Neko Legends contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "multi_angle_edit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-opener = "2.5.0"
uuid = { version = "1", features = ["v4"] }
